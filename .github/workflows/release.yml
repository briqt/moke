name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate release metadata
        run: |
          TAG="${{ github.ref_name }}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] \
            || { echo "❌ 非法版本标签：$TAG"; exit 1; }
          EXPECTED_VERSION="${TAG#v}"
          ACTUAL_VERSION="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          [ "$ACTUAL_VERSION" = "$EXPECTED_VERSION" ] \
            || { echo "❌ tag=$EXPECTED_VERSION，但 versionName=$ACTUAL_VERSION"; exit 1; }
          echo "✅ release metadata: versionName=$ACTUAL_VERSION"

      # mosh native 产物（GPLv3 二进制不入库）——发布包必须自行构建，否则 APK 缺 libmosh-client.so，
      # 选 mosh 协议会因缺 native 库而不可用。见 scripts/build-mosh-native.sh。
      - name: Install NDK r30
        run: sdkmanager --install "ndk;30.0.16248370"

      # netbridge（Go）：版本取 netbridge/go.mod 的 toolchain 行；gomobile 由 go.mod 的 tool 依赖锁定。
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: netbridge/go.mod
          cache-dependency-path: netbridge/go.sum

      - name: Build netbridge AAR
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370" bash scripts/build-netbridge.sh

      - name: Build mosh native (arm64-v8a)
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/30.0.16248370"
          [ -d "$NDK_DIR" ] || NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/30.* 2>/dev/null | sort -V | tail -1)"
          [ -d "$NDK_DIR" ] || NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)"
          echo "Using NDK: $NDK_DIR"
          export ANDROID_NDK="$NDK_DIR"
          bash scripts/build-mosh-native.sh arm64-v8a
          ls -lh app/src/main/jniLibs/arm64-v8a/

      # 内置字体（OFL，不入库）——release 构建缺它会直接失败。
      - name: Fetch Maple font
        run: bash scripts/fetch-maple-font.sh

      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/moke-release.jks"

      - name: Assemble release APK
        env:
          MOKE_KEYSTORE: ${{ runner.temp }}/moke-release.jks
          MOKE_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          MOKE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          MOKE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # 守卫：确保 mosh native 库已打进 APK，避免再次发出「选 mosh 即崩」的包。
      - name: Verify native libs packaged
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libmosh-client.so" || { echo "❌ $APK 缺 libmosh-client.so"; exit 1; }
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libtermux.so" || { echo "❌ $APK 缺 libtermux.so"; exit 1; }
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libgojni.so" || { echo "❌ $APK 缺 libgojni.so"; exit 1; }
          # release 构建会压缩资源路径（res/font/maple_mono.ttf → res/xx.ttf），故按体积判定：
          # 内置 Maple 字体约 20MB，是唯一 >15MB 的 ttf。
          unzip -l "$APK" | awk '/\.ttf$/ && $1+0 > 15000000 {f=1} END{exit !f}' \
            || { echo "❌ 缺内置 Maple 字体（未见 >15MB 的 ttf）"; exit 1; }
          echo "✅ native 库与内置字体已打包"

      - name: Stage APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/moke-${{ github.ref_name }}.apk"
          ls -lh dist/

      - name: Extract changelog section
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"; VER="${TAG#v}"
          # 抽出 CHANGELOG.md 里 "## [x.y.z]" 到下一个 "## [" 之间的内容；抽不到就留空（下游回退到静态说明）。
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > /tmp/section.md || true
          if [ -s /tmp/section.md ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
          { echo 'body<<CHANGELOG_EOF'; cat /tmp/section.md; echo 'CHANGELOG_EOF'; } >> "$GITHUB_OUTPUT"
          echo "--- 提取结果 ---"; cat /tmp/section.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: moke ${{ github.ref_name }}
          # SemVer 后缀（如 -rc.1）只发布为 GitHub Pre-release，且绝不占用 Latest。
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          generate_release_notes: false
          files: dist/moke-*.apk
          body: |
            ${{ steps.changelog.outputs.body }}
