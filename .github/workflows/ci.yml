name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # netbridge（Go）：版本取 netbridge/go.mod 的 toolchain 行；gomobile 由 go.mod 的 tool 依赖锁定。
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: netbridge/go.mod
          cache-dependency-path: netbridge/go.sum

      - name: Go tests
        working-directory: netbridge
        run: go test -race -count=1 ./...

      - name: Install NDK r30
        run: sdkmanager --install "ndk;30.0.16248370"

      - name: Build netbridge AAR
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370" bash scripts/build-netbridge.sh

      # 不取内置字体（约 150MB 下载）：缺字体时 debug 照常构建，内置字体的 release 构建在 Release 工作流验证。
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android lint (all modules)
        run: ./gradlew lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: moke-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
